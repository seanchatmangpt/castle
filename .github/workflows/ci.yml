name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # castle is a single-crate, stable-toolchain build (Cargo.toml pins
      # rust-version = "1.82", no rust-toolchain.toml / nightly requirement
      # the way ggen's workspace has). dtolnay/rust-toolchain, SHA-pinned
      # for supply-chain safety, same as ggen/ggen-marketplace CI.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
          components: rustfmt,clippy

      # Swatinem/rust-cache, SHA-pinned, matching the ggen ecosystem's
      # caching convention (registry + target/ dir keyed on Cargo.lock).
      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: cargo build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: cargo test (workspace)
        run: cargo test --workspace

      # castle's Cargo.toml [lints] are deliberately warn-only ("inventory
      # before enforce"). Matching the ggen ecosystem's own PR-gating
      # convention (ggen's ci.yml quality_deep lane): clippy runs and
      # reports but does not fail the build.
      - name: cargo clippy (reporting only, non-blocking)
        run: cargo clippy --workspace --all-targets || echo '::warning::clippy debt remains advisory'
