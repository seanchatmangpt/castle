name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: castle-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic runtime tests
        run: npm test

  ggen-rdf:
    name: ggen RDF exact-subject qualification
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/castle-ggen-rdf-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove exact ggen-engine source declaration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'rev = "162e466d8f07d0a75a468b4441b4bc8b1aad369b"' crates/castle-ggen-rdf/Cargo.toml
          grep -F 'package = "ggen-engine"' crates/castle-ggen-rdf/Cargo.toml
      - name: Build CASTLE bridge over pinned ggen-engine
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo build --release --manifest-path crates/castle-ggen-rdf/Cargo.toml
          test -x "${CARGO_TARGET_DIR}/release/castle-ggen-rdf"
          printf 'CASTLE_GGEN_RDF_BIN=%s\n' "${CARGO_TARGET_DIR}/release/castle-ggen-rdf" >> "${GITHUB_ENV}"
      - name: Prove bridge reports exact ggen semantic subject
        shell: bash
        run: |
          set -euo pipefail
          "${CASTLE_GGEN_RDF_BIN}" version | tee /tmp/ggen-version.json
          grep -F '"engine":"ggen-engine"' /tmp/ggen-version.json
          grep -F '"version":"26.8.15"' /tmp/ggen-version.json
          grep -F '"commit":"162e466d8f07d0a75a468b4441b4bc8b1aad369b"' /tmp/ggen-version.json
      - name: Execute real RDF/SPARQL/CONSTRUCT qualification
        env:
          CASTLE_GGEN_INTEGRATION: "1"
        run: node --experimental-strip-types --test test/ggen-rdf.integration.test.ts
