name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: castle-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Verify, publish, and receipt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Resolve immutable release identity
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "${cargo_version}"
          tag="v${cargo_version}"
          binary="castle-${tag}-x86_64-unknown-linux-gnu"
          manifest="configs/fortune5-${tag}.json"
          test -f "${manifest}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"
          echo "CASTLE_RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "CASTLE_RELEASE_BINARY=${binary}" >> "${GITHUB_ENV}"
          echo "CASTLE_RELEASE_MANIFEST=${manifest}" >> "${GITHUB_ENV}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "${tag}"
          fi

      - name: Reconcile generated lockfile before first tag
        if: github.ref == 'refs/heads/main' && steps.release-state.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m "chore: synchronize ${CASTLE_RELEASE_TAG} lockfile"
            git push origin HEAD:main
          fi

      - name: Materialize exact release subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.release-state.outputs.tag_exists }}" == "true" ]]; then
            subject="${RUNNER_TEMP}/castle-release-subject"
            rm -rf "${subject}"
            git worktree add --detach "${subject}" "${CASTLE_RELEASE_TAG}"
          else
            subject="${GITHUB_WORKSPACE}"
          fi
          tag_commit="$(git rev-list -n1 "${CASTLE_RELEASE_TAG}" 2>/dev/null || git rev-parse HEAD)"
          echo "CASTLE_RELEASE_SUBJECT=${subject}" >> "${GITHUB_ENV}"
          echo "CASTLE_RELEASE_TAG_COMMIT=${tag_commit}" >> "${GITHUB_ENV}"
          echo "dir=${subject}" >> "${GITHUB_OUTPUT}"
          echo "tag_commit=${tag_commit}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact release subject and DfCM runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "${CASTLE_RELEASE_SUBJECT}"
          cargo metadata --locked --format-version 1 >/dev/null
          cargo build --locked --workspace --all-targets
          cargo test --locked --workspace
          cargo run --locked --bin castle -- deployment qualify \
            --manifest-path "${CASTLE_RELEASE_MANIFEST}" \
            --now-epoch-ms 1787080000000 \
            --format json | tee "${RUNNER_TEMP}/deployment.json"
          grep -q '"standing":"ALIVE"' "${RUNNER_TEMP}/deployment.json"
          cargo run --locked --bin castle -- dfcm verify --format json \
            | tee "${RUNNER_TEMP}/dfcm-runtime.json"
          grep -q '"standing":"ALIVE"' "${RUNNER_TEMP}/dfcm-runtime.json"

      - name: Package release if publication is missing
        if: steps.release-state.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${CASTLE_RELEASE_SUBJECT}"
          cargo build --locked --release --bin castle
          mkdir -p "${RUNNER_TEMP}/dist"
          cp target/release/castle "${RUNNER_TEMP}/dist/${CASTLE_RELEASE_BINARY}"
          (
            cd "${RUNNER_TEMP}/dist"
            sha256sum "${CASTLE_RELEASE_BINARY}" > SHA256SUMS
          )

      - name: Cut immutable Cargo-version tag if absent
        if: github.ref == 'refs/heads/main' && steps.release-state.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${CASTLE_RELEASE_TAG}" -m "CASTLE ${CASTLE_RELEASE_TAG}" HEAD
          git push origin "refs/tags/${CASTLE_RELEASE_TAG}"
          echo "CASTLE_RELEASE_TAG_COMMIT=$(git rev-list -n1 "${CASTLE_RELEASE_TAG}")" >> "${GITHUB_ENV}"

      - name: Publish GitHub release if missing
        if: steps.release-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${CASTLE_RELEASE_TAG}" \
            "${RUNNER_TEMP}/dist/${CASTLE_RELEASE_BINARY}" \
            "${RUNNER_TEMP}/dist/SHA256SUMS" \
            --title "CASTLE ${CASTLE_RELEASE_TAG}" \
            --generate-notes \
            --verify-tag

      - name: Verify published Release object and assets
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="${RUNNER_TEMP}/published-assets"
          rm -rf "${receipt_dir}"
          mkdir -p "${receipt_dir}"
          gh release view "${CASTLE_RELEASE_TAG}" \
            --json tagName,url,isDraft,isPrerelease,targetCommitish,assets \
            > "${RUNNER_TEMP}/release.json"
          python3 - "${RUNNER_TEMP}/release.json" "${CASTLE_RELEASE_TAG}" "${CASTLE_RELEASE_BINARY}" <<'PY'
          import json, sys
          path, tag, binary = sys.argv[1:]
          with open(path, encoding="utf-8") as fh:
              release = json.load(fh)
          if release.get("tagName") != tag:
              raise SystemExit("REFUSED:RELEASE_TAG_MISMATCH")
          if release.get("isDraft"):
              raise SystemExit("REFUSED:RELEASE_IS_DRAFT")
          names = {a.get("name") for a in release.get("assets", [])}
          missing = sorted({binary, "SHA256SUMS"} - names)
          if missing:
              raise SystemExit("REFUSED:RELEASE_ASSET_MISSING:" + ",".join(missing))
          PY
          gh release download "${CASTLE_RELEASE_TAG}" -p "${CASTLE_RELEASE_BINARY}" -D "${receipt_dir}"
          gh release download "${CASTLE_RELEASE_TAG}" -p SHA256SUMS -D "${receipt_dir}"

          nonempty_lines="$(grep -cve '^[[:space:]]*$' "${receipt_dir}/SHA256SUMS" || true)"
          test "${nonempty_lines}" = "1"
          expected_hash="$(awk 'NF {print $1; exit}' "${receipt_dir}/SHA256SUMS")"
          expected_name="$(awk 'NF {$1=""; sub(/^[[:space:]]+/, ""); sub(/^\*/, ""); print; exit}' "${receipt_dir}/SHA256SUMS")"
          actual_hash="$(sha256sum "${receipt_dir}/${CASTLE_RELEASE_BINARY}" | awk '{print $1}')"
          [[ "${expected_hash}" =~ ^[0-9a-f]{64}$ ]]
          if [[ "${expected_hash}" != "${actual_hash}" ]]; then
            echo "::error::REFUSED:RELEASE_BINARY_HASH_MISMATCH:expected=${expected_hash}:actual=${actual_hash}"
            exit 2
          fi

          checksum_manifest_repaired=false
          if [[ "${expected_name}" != "${CASTLE_RELEASE_BINARY}" ]]; then
            printf '%s  %s\n' "${actual_hash}" "${CASTLE_RELEASE_BINARY}" > "${receipt_dir}/SHA256SUMS"
            gh release upload "${CASTLE_RELEASE_TAG}" "${receipt_dir}/SHA256SUMS" --clobber
            checksum_manifest_repaired=true
          fi
          (
            cd "${receipt_dir}"
            sha256sum -c SHA256SUMS
          )
          echo "binary_sha256=${actual_hash}" >> "${GITHUB_OUTPUT}"
          echo "checksum_manifest_repaired=${checksum_manifest_repaired}" >> "${GITHUB_OUTPUT}"

      - name: Manufacture publication receipt on main
        if: github.ref == 'refs/heads/main'
        env:
          BINARY_SHA256: ${{ steps.publication.outputs.binary_sha256 }}
          CHECKSUM_MANIFEST_REPAIRED: ${{ steps.publication.outputs.checksum_manifest_repaired }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_path=".github/release-receipts/${CASTLE_RELEASE_TAG}.json"
          mkdir -p "$(dirname "${receipt_path}")"
          tag_commit="$(git rev-list -n1 "${CASTLE_RELEASE_TAG}")"
          tag_tree="$(git rev-parse "${CASTLE_RELEASE_TAG}^{tree}")"
          sha256sums="$(cat "${RUNNER_TEMP}/published-assets/SHA256SUMS")"
          python3 - "${RUNNER_TEMP}/release.json" "${RUNNER_TEMP}/dfcm-runtime.json" "${receipt_path}" "${CASTLE_RELEASE_TAG}" "${tag_commit}" "${tag_tree}" "${CASTLE_RELEASE_MANIFEST}" "${CASTLE_RELEASE_BINARY}" "${BINARY_SHA256}" "${sha256sums}" "${CHECKSUM_MANIFEST_REPAIRED}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" <<'PY'
          import json, sys
          release_path, dfcm_path, out, tag, commit, tree, manifest, binary, binary_sha, sums, repaired, run_id, attempt = sys.argv[1:]
          with open(release_path, encoding="utf-8") as fh:
              release = json.load(fh)
          with open(dfcm_path, encoding="utf-8") as fh:
              dfcm = json.load(fh)
          assets = sorted(
              ({"name": a.get("name"), "size": a.get("size"), "url": a.get("url")} for a in release.get("assets", [])),
              key=lambda a: a["name"] or "",
          )
          receipt = {
              "kind": "CASTLE_GITHUB_RELEASE_RECEIPT_V2",
              "standing": "ALIVE",
              "tag": tag,
              "tag_commit": commit,
              "tag_tree": tree,
              "manifest": manifest,
              "dfcm_runtime_standing": dfcm.get("standing"),
              "release_url": release.get("url"),
              "release_is_draft": release.get("isDraft"),
              "release_is_prerelease": release.get("isPrerelease"),
              "target_commitish": release.get("targetCommitish"),
              "assets": assets,
              "binary": binary,
              "binary_sha256": binary_sha,
              "sha256sums": sums,
              "checksum_manifest_repaired": repaired == "true",
              "evidence": [
                  "cargo metadata --locked",
                  "cargo build --locked --workspace --all-targets",
                  "cargo test --locked --workspace",
                  "castle deployment qualify exact versioned manifest",
                  "castle dfcm verify real PQC + protocol fence + read-only subprocess",
                  "gh release view/download",
                  "sha256sum -c SHA256SUMS",
                  "git rev-list exact tag",
                  "git rev-parse exact tag tree",
              ],
              "workflow_run_id": run_id,
              "workflow_run_attempt": attempt,
          }
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(receipt, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${receipt_path}"
          if git diff --cached --quiet; then
            echo "Publication receipt already exact."
            exit 0
          fi
          git commit -m "release: receipt ${CASTLE_RELEASE_TAG} publication"
          git push origin HEAD:main
