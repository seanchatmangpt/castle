name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${cargo_version}"

      - name: Build and test exact tag
        run: |
          cargo build --workspace --all-targets
          cargo test --workspace

      - name: Qualify checked-in Fortune-5 topology
        run: |
          cargo run --bin castle -- deployment qualify \
            --manifest-path configs/fortune5-v26.8.18.json \
            --now-epoch-ms 1787080000000 \
            --format json | tee /tmp/deployment.json
          grep -q '"standing":"ALIVE"' /tmp/deployment.json

      - name: Package Linux binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin castle
          mkdir -p dist
          cp target/release/castle "dist/castle-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          sha256sum dist/castle-* > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "CASTLE ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
